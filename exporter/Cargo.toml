[package]
name = "exporter"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.6.12"
dotenvy = "0.15.7"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.95"
sqlx = { version = "0.6.3", features=  ["runtime-tokio-rustls", "postgres", "json"]}
tokio = { version = "1.27.0", features = ["full"] }
tracing = "0.1.37"
tracing-subscriber = "0.3.16"
